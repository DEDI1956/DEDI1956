<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek IP & Speed Test</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        input, button { margin: 10px; padding: 10px; }
        #result { margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Cek IP & Speed Test</h2>
    <input type="text" id="ip" placeholder="Masukkan IP" />
    <input type="text" id="port" placeholder="Masukkan Port" />
    <button onclick="checkIP()">Cek</button><div id="result"></div>

<script>
    async function checkIP() {
        const ip = document.getElementById("ip").value;
        const port = document.getElementById("port").value;
        if (!ip || !port) {
            alert("Masukkan IP dan Port terlebih dahulu");
            return;
        }
        
        document.getElementById("result").innerHTML = "Mengecek...";
        
        try {
            const response = await fetch(`https://testip.vipcf.pekerja.dev/?ip=${ip}&port=${port}`);
            const data = await response.json();
            
            if (data.online) {
                document.getElementById("result").innerHTML = `
                    <p><strong>Status:</strong> ✅ IP Aktif</p>
                    <p><strong>Ping:</strong> ${data.ping} ms</p>
                    <p><strong>Download Speed:</strong> ${data.downloadSpeed} Mbps</p>
                    <p><strong>Upload Speed:</strong> ${data.uploadSpeed} Mbps</p>
                `;
            } else {
                document.getElementById("result").innerHTML = `<p><strong>Status:</strong> ❌ IP Tidak Aktif</p>`;
            }
        } catch (error) {
            document.getElementById("result").innerHTML = `<p>Error saat mengecek IP</p>`;
        }
    }
</script>

</body>
</html>
